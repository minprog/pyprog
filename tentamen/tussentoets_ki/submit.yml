name: tussentoets_ki
exam: true
files:
    required:
        tussentoets.py: ''
buttons:
    check: |
        import ast

        FORBIDDEN_METHODS = ['split', 'find', 'join', 'count']
        FORBIDDEN_BUILTINS = ['sorted', 'min', 'max', 'abs', 'reversed']

        def find_forbidden(src: str) -> list[str]:
            """
            Vindt aanroepen naar verboden string-methodes en builtins,
            slicing, comprehensions en vermenigvuldigen met `*`.
            Geeft een lijst met foutberichten, met per bericht de regel.
            Geeft een lege lijst als er niks aan de hand is :)
            """
            results = []
            lines = src.split("\n")

            def line_of(node: ast.AST) -> str:
                return lines[node.lineno - 1].strip()

            class Visitor(ast.NodeVisitor):
                def visit_Slice(self, node: ast.Slice):
                    results.append(
                        f"!! Je mag geen gebruik maken van slicing op het tentamen.\n"
                        f"Bijvoorbeeld op regel {node.lineno}:\n{line_of(node)}"
                    )
                    self.generic_visit(node)

                def visit_Call(self, node: ast.Call):
                    if isinstance(node.func, ast.Name) and node.func.id in FORBIDDEN_BUILTINS:
                        results.append(
                            f"!! Je mag de builtin-functie `{node.func.id}` niet gebruiken.\n"
                            f"Bijvoorbeeld op regel {node.lineno}:\n{line_of(node)}"
                        )
                    if isinstance(node.func, ast.Attribute) and node.func.attr in FORBIDDEN_METHODS:
                        results.append(
                            f"!! Je mag geen string-methodes zoals `{node.func.attr}` gebruiken.\n"
                            f"Bijvoorbeeld op regel {node.lineno}:\n{line_of(node)}"
                        )
                    self.generic_visit(node)

                def _comprehension(self, node: ast.AST):
                    results.append(
                        f"!! Je mag geen comprehensions gebruiken.\n"
                        f"Bijvoorbeeld op regel {node.lineno}:\n{line_of(node)}"
                    )
                    self.generic_visit(node)

                visit_ListComp = _comprehension
                visit_SetComp = _comprehension
                visit_DictComp = _comprehension
                visit_GeneratorExp = _comprehension

                def visit_BinOp(self, node: ast.BinOp):
                    if isinstance(node.op, ast.Mult):
                        results.append(
                            f"!! Let op: vermenigvuldigen met strings (`*`) is niet toegestaan.\n"
                            f"Controleer regel {node.lineno}:\n{line_of(node)}"
                        )
                    self.generic_visit(node)

            Visitor().visit(ast.parse(src))
            return results

        with open('<filename>.py') as f:
            code = f.read()
        res = find_forbidden(code)
        if res:
            print()
            print('\n\n'.join(res))
            print()
            print("\033[93mAls je twijfelt of de waarschuwing hierboven klopt en\nje denkt dat het gewoon mag, check met de docent.\033[0m")
        else:
            print("\nGeen verboden constructies gevonden, maar het is je eigen\n"
                    "verantwoordelijkheid om alleen toegestane onderdelen te\ngebruiken.")
    mypy: |
        print("Checking types...")

        from mypy import api as mypy_api
        mypy_api.run(['--strict', '<filename>.py'])[0]

    doctest: |
        import sys
        import importlib
        import doctest

        modname = "<filename>"

        # Remove cached module
        if modname in sys.modules:
            del sys.modules[modname]

        # Reimport from updated source
        mod = importlib.import_module(modname)

        # Run doctests
        doctest.testmod(mod, verbose=True)
