    check: |
        import ast

        def find_forbidden(src: str) -> list[str]:
            """
            Vindt dingen die op geen enkele toets zijn toegestaan.
            Geeft een lijst met foutberichten, gesorteerd op regelnummer.
            Geeft een lege lijst als er niks aan de hand is :)
            """
            lines = src.split("\n")
            try:
                tree = ast.parse(src)
            except SyntaxError as e:
                return [f"!! Syntaxfout op regel {e.lineno}:\n{e.msg}"]

            forbidden_methods = {'split', 'find', 'join', 'count'}
            forbidden_builtins = {
                'sorted', 'reversed', 'min', 'max', 'abs', 'map', 'zip', 'all', 'any', 'eval',
            }
            forbidden_imports = {'math', 'decimal'}
            old_typing = ['Optional', 'List[', 'Tuple[', 'Dict[', 'Set[']
            found = []

            def report(node: ast.AST, text: str):
                line = lines[node.lineno - 1].strip()
                found.append((node.lineno, f"!! {text} op regel {node.lineno}:\n{line}"))

            class Visitor(ast.NodeVisitor):
                function_depth = 0

                def visit_Attribute(self, node: ast.Attribute):
                    if node.attr in forbidden_methods:
                        report(node, f"Je mag de methode {node.attr} niet gebruiken")
                    self.generic_visit(node)

                def visit_Call(self, node: ast.Call):
                    if isinstance(node.func, ast.Name) and node.func.id in forbidden_builtins:
                        report(node, f"Je mag de functie {node.func.id} niet gebruiken")
                    self.generic_visit(node)

                def visit_Try(self, node: ast.Try):
                    report(node, "Je mag try niet gebruiken")
                    self.generic_visit(node)

                def visit_Import(self, node: ast.Import):
                    for alias in node.names:
                        if alias.name in forbidden_imports:
                            report(node, f"Je mag {alias.name} niet importeren")

                def visit_ImportFrom(self, node: ast.ImportFrom):
                    if node.module in forbidden_imports:
                        report(node, f"Je mag {node.module} niet importeren")

                def visit_FunctionDef(self, node: ast.FunctionDef):
                    self.function_depth += 1
                    self.generic_visit(node)
                    self.function_depth -= 1

                def visit_Name(self, node: ast.Name):
                    if self.function_depth > 0 and node.id in ('print', 'input'):
                        report(node, f"{node.id} hoort niet gebruikt te worden in je uitwerking van de opgaven")

                def _comprehension(self, node: ast.expr):
                    report(node, "Je mag geen comprehensions gebruiken")
                    self.generic_visit(node)

                visit_ListComp = visit_SetComp = visit_DictComp = visit_GeneratorExp = _comprehension

            Visitor().visit(tree)

            for nr, line in enumerate(lines, start=1):
                if "\t" in line:
                    found.append((nr, f"!! Je mag geen tabs gebruiken op regel {nr}:\n{line.strip()}"))
                for name in old_typing:
                    if name in line:
                        found.append((nr, f"!! Gebruik list[...] en ... | None i.p.v. {name} "
                                          f"op regel {nr}:\n{line.strip()}"))
            return [msg for _, msg in sorted(found)]

        with open('<filename>.py') as f:
            code = f.read()
        res = find_forbidden(code)
        if res:
            print()
            print('\n\n'.join(res))
        else:
            print("\nGeen verboden constructies gevonden, maar je moet het zelf ook checken!")
    mypy: |
        print("Checking types...")

        from mypy import api as mypy_api
        mypy_api.run(['--strict', '<filename>.py'])[0]

    doctest: |
        import sys
        import importlib
        import doctest

        modname = "<filename>"

        # Remove cached module
        if modname in sys.modules:
            del sys.modules[modname]

        # Reimport from updated source
        mod = importlib.import_module(modname)

        # Run doctests
        doctest.testmod(mod, verbose=True)
