            # --- 5. Changing case -------------------------------------------------------

            def shout(s: str) -> str:
                """
                upper() makes all caps. You can also add extra characters after converting.

                >>> shout("hello")
                'HELLO!'
                """
                return s.upper() + "!"


            def quiet(s: str) -> str:
                """
                lower() makes all lowercase. You can also add punctuation.

                >>> quiet("LOUD")
                'loud.'
                """
                return s.lower() + "."


            # --- 7. Looping over characters ---------------------------------------------

            def count_vowels(s: str) -> int:
                """
                To count something in a string:
                  count = 0
                  for each character in the string:
                      if it matches what we want:
                          increase count

                Here we count vowels (a, e, i, o, u).

                >>> count_vowels("Python")
                1
                >>> count_vowels("education")
                5
                """
                count = 0
                for ch in s.lower():
                    if ch in "aeiou":
                        count += 1
                return count
