                ...

            # --- 2. String indexing -----------------------------------------

            def first_char(s: str) -> str:
                """
                Indexing: each character in a string has a position (index). Counting starts at 0.
                Use s[0] to get the first character.

                For example, for "Python":
                   P  y  t  h  o  n
                   0  1  2  3  4  5

                >>> first_char("Python")
                'P'
                >>> first_char("abc")
                'a'
                """
                # TODO: return the first character of s
                return s[0]


            def last_char(s: str) -> str:
                """
                Negative indexes count from the end. Use s[-1] for the last character, s[-2] for second last.

                >>> last_char("Python")
                'n'
                >>> last_char("code")
                'e'
                """
                # TODO: return the last character of s
                return s[-1]


            # --- 3. Combining and repeating strings -------------------------------------

            def excited(word: str) -> str:
                """
                + joins (concatenates) strings together. * repeats a string.

                Examples:
                  'Hi' + '!'  -> 'Hi!'
                  'Go' * 3    -> 'GoGoGo'

                >>> excited("Hi")
                'Hi!!!'
                """
                # TODO: return word + "!!!"
                return word + "!!!"


            def double_and_space(a: str, b: str) -> str:
                """
                You can repeat and combine text to build new strings.

                >>> double_and_space("go", "team")
                'gogo teamteam'
                """
                # TODO: return each word twice with a space between them
                return a * 2 + " " + b * 2


            # --- 4. Checking and searching ----------------------------------------------

            def contains_in_python(x: str) -> bool:
                """
                'in' checks if one string occurs inside another.
                Here we check if the given string is inside the word 'python'.

                >>> contains_in_python('py')
                True
                >>> contains_in_python('java')
                False
                """
                # TODO: return whether x is in 'python'
                return x in "python"

