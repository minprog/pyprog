name: werkcollege_6
exam: true
buttons:
    Run doctest: |
        import <filename>
        import doctest
        doctest.testmod(<filename>, verbose=True)
    Run typecheck: |
        from mypy import api as mypy_api
        mypy_api.run(['--strict', '<filename>.py'])[0]
files:
    required:
        lists.py: |
            # Maak onderstaande functies.
            #
            # Let op: gebruik de knop "Run doctest" om je code uit te
            # proberen en "Run typecheck" om de types te checken.
            def stretch(s: str) -> str:
                """
                Elk teken uit origineel wordt steeds vaker toegevoegd.
                Zie doctests.

                >>> stretch('abc')
                'abbccc'
                >>> stretch('Hoi!')
                'Hooiii!!!!'
                """

            def autocorrect(s: str) -> str:
                """
                Verwijdert dubbele leestekens en spaties.
                Dus alles behalve gewone letters en cijfers.
                Gewone letters en cijfers herken je met .isalnum()

                >>> autocorrect('---')
                '-'
                >>> autocorrect('Dit hier,, dit kan niet de bedoeling   zijn.')
                'Dit hier, dit kan niet de bedoeling zijn.'
                """
