# This is a separate section containing a few templates that we will use below.
# The & feature is built into YAML, it is not a special feature of the website.
# The section does not need to be called `templates` necessarily.

templates:
    1: &automatic
        type: pass
        subgrades:
            done: boolean
        automatic:
            done: -(correctness_score.floor)
        calculation: done
        auto_publish: true
        hide_calculated: true
    2: &check
        type: pass
        subgrades:
            done: boolean
        calculation: done
        hide_calculated: true
    3: &tentamen
        type: points
        subgrades:
            deel_1: integer
            deel_2: integer
        calculation: deel_1 + deel_2
    4: &werkcollege
        type: pass
        exam: true
        subgrades:
            meegedaan: boolean
        calculation: meegedaan
        hide_calculated: false
        auto_publish: false
        hide_subgrades: true

