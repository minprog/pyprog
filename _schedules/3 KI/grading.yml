_settings:
    start_date: 26/10/26
    end_date: 18/12/26

grades:
    # De tussentoets levert de 11 punten van het basisdeel op.
    tussentoets_ki:
        type: points
        exam: true
        hide_calculated: true
        subgrades:
            python: integer
    tentamen:
        type: points
        exam: true
        hide_calculated: true
        subgrades:
            python: integer
            advanced_python: integer

    # handmatig af te vinken, geen automatische controle
    oefentoets:
        type: pass
        subgrades:
            meegedaan: boolean
        calculation: meegedaan
        hide_calculated: true

    # bij hertentamen vervallen alle eerdere tentamencijfers
    hertentamen:
        type: points
        exam: true
        subgrades:
            python: integer
            advanced_python: integer
        calculation: sum_all

calculation:
    # Totaal 28 punten: tentamen 22 + werkcolleges 6.
    eindcijfer:
        werkcolleges?: 6
        python: 11
        advanced_python: 11
    herkansing:
        werkcolleges?: 6
        hertentamen: 22

